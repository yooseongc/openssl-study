name: openssl-study
services:
  study:
    build: .
    ports:
      - "127.0.0.1:8440:8080"
    volumes:
      - lab-data:/home/student/lab
      - ide-data:/home/student/ide-data
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  lab-data:
  ide-data:
